name: Mobile App Build Fixed

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v1.0.3)'
        required: false
        default: 'v1.0.3'
      create_release:
        description: 'Create a GitHub Release with the APK'
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/mobile-app-build-fixed.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Grant Execute Permission to Gradlew
        run: |
          chmod +x android/gradlew
          chmod +x android/gradlew.bat

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Locate & Package APK
        run: |
          mkdir -p release-artifacts
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} release-artifacts/anvi-mitra-erp.apk \;
          ls -la release-artifacts/

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anvi-mitra-erp-apk
          path: release-artifacts/anvi-mitra-erp.apk

      - name: Publish GitHub Release
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag || github.ref_name }}
          name: "Anvi Mitra ERP Mobile App ${{ github.event.inputs.version_tag || github.ref_name }}"
          body: |
            ## Anvi Mitra ERP Mobile App
            
            Production Android APK for Anvi Mitra School ERP.
            
            ### Included:
            - Connected to Cloudflare production worker (`https://anvimitra-erp.rv5646718.workers.dev`)
            - Multi-school portal access (Super Admin, Principal, Admin, Teacher, Accountant, Parent, Student)
            - Offline cache & sync outbox
            - Interactive server configuration & retry on connection error
            - Android camera & file upload bridge
            
            Install `anvi-mitra-erp.apk` below directly on any Android 8.0+ device.
          files: release-artifacts/anvi-mitra-erp.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
