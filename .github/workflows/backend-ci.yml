name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Syntax & Unit Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: erp/package.json

      - name: Install Dependencies
        working-directory: erp
        run: npm ci

      - name: Syntax Check
        working-directory: erp
        run: npm run check

      - name: Run Test Suite
        working-directory: erp
        run: npm test
