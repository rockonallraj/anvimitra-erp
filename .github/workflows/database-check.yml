name: Database Check

on:
  push:
    branches:
      - main
    paths:
      - 'erp/sql/**'
      - 'erp/src/migrate.js'
      - '.github/workflows/database-check.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  database-migrations:
    name: PostgreSQL Schema Replay & Integrity
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: anvi_mitra_erp_test
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: erp/package.json

      - name: Install Dependencies
        working-directory: erp
        run: npm ci

      - name: Run Schema Migrations
        working-directory: erp
        env:
          DATABASE_URL: postgres://erp_user:erp_password@localhost:5432/anvi_mitra_erp_test
        run: node src/migrate.js

      - name: Verify Super Admin Seed
        working-directory: erp
        env:
          DATABASE_URL: postgres://erp_user:erp_password@localhost:5432/anvi_mitra_erp_test
        run: node scripts/seed-superadmin.js
