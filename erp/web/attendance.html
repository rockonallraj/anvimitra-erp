<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Anvi Mitra ERP • Daily Attendance</title>
  <link rel="stylesheet" href="/erp/web/shared/css/dashboard.css">
  <style>
    :root {
      font-family: Inter, system-ui, sans-serif;
      color: #172033;
      background: #f4f7fb;
      --brand: #4f46e5;
      --line: #e4e8f0;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f7fb; }
    .wrap { max-width: 1250px; margin: auto; padding: 20px; }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .top h1 { margin: 0; font-size: 26px; font-weight: 800; color: #1e1b4b; }
    .scope-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eef2ff;
      color: #4338ca;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-top: 4px;
    }
    .btn {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all .15s ease;
    }
    .btn:hover { background: #f8fafc; }
    .btn:active { transform: scale(0.97); }
    .btn.primary {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25);
    }
    .btn.primary:hover { filter: brightness(1.08); }
    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .filters {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    label {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: .05em;
      display: block;
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d9deea;
      border-radius: 10px;
      background: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    input:focus, select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }
    .actions { display: flex; gap: 8px; align-items: end; }
    .summary {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .pill {
      background: #f8fafc;
      border: 1px solid var(--line);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
    }
    .pill b { color: #1e293b; }
    .table-wrap {
      overflow-x: auto;
      margin-top: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .table { width: 100%; border-collapse: collapse; }
    .table th, .table td {
      padding: 12px 14px;
      border-bottom: 1px solid #f1f5f9;
      text-align: left;
      font-size: 13px;
    }
    .table th {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      background: #f8fafc;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .status-select {
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid #d9deea;
      background: white;
      font-weight: 600;
      font-size: 13px;
    }
    .msg {
      font-size: 13px;
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      display: none;
    }
    .msg.ok { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .msg.err { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .empty { text-align: center; color: #64748b; padding: 30px; }
    .branch-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    @media (max-width: 850px) {
      .filters { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 520px) {
      .filters { grid-template-columns: 1fr; }
      .top { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div>
        <h1>Daily Attendance</h1>
        <div class="scope-pill" id="scopePill">
          <span>🏫</span> <span id="scopeText">Loading school & branch scope…</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <div class="branch-selector" id="branchBox" style="display:none">
          <label style="margin:0;font-size:11px">BRANCH:</label>
          <select id="branchSelect" style="width:auto;padding:4px 8px;font-size:12px;margin:0;border:0;background:transparent"></select>
        </div>
        <button class="btn report" onclick="location.href='/erp/web/attendance-report.html'">📊 Report</button>
        <button class="btn" onclick="location.href='/erp/web/portal-dashboard.html'">← Dashboard</button>
      </div>
    </div>

    <section class="panel">
      <div class="filters">
        <div>
          <label for="date">ATTENDANCE DATE</label>
          <input id="date" type="date">
        </div>
        <div>
          <label for="session">ACADEMIC SESSION</label>
          <select id="session"><option value="">Current session</option></select>
        </div>
        <div>
          <label for="section">CLASS & SECTION</label>
          <select id="section"><option value="">All sections</option></select>
        </div>
        <div class="actions">
          <button class="btn primary" style="width:100%" onclick="loadStudents()">Load Roster</button>
        </div>
      </div>

      <div class="summary">
        <div class="pill">Enrolled: <b id="count">0</b></div>
        <div class="pill" style="color:#059669">Present: <b id="present">0</b></div>
        <div class="pill" style="color:#dc2626">Absent: <b id="absent">0</b></div>
        <div class="pill" style="color:#d97706">Late: <b id="late">0</b></div>
        <div class="pill">Marked: <b id="marked">0</b></div>
      </div>
    </section>

    <section class="panel">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap">
        <h3 style="margin:0;font-size:17px;font-weight:700">Attendance Roster</h3>
        <div style="display:flex;gap:8px">
          <button class="btn" onclick="setAll('present')">✓ Mark All Present</button>
          <button class="btn" onclick="setAll('absent')">✕ Mark All Absent</button>
        </div>
      </div>

      <div id="msg" class="msg"></div>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>STUDENT</th>
              <th>ADMISSION NO</th>
              <th>CLASS / SECTION</th>
              <th>STATUS</th>
              <th>REMARKS / NOTE</th>
            </tr>
          </thead>
          <tbody id="body">
            <tr><td colspan="5" class="empty">Loading student roster…</td></tr>
          </tbody>
        </table>
      </div>

      <div style="margin-top:16px;display:flex;justify-content:flex-end">
        <button class="btn primary" id="saveBtn" style="padding:12px 24px;font-size:14px" onclick="save()">Save & Finalize Attendance</button>
      </div>
    </section>
  </main>

  <script src="/erp/web/api.js"></script>
  <script>
    (async () => {
      if (!LSKERP.token()) {
        location.replace('/erp/web/login.html');
        return;
      }

      const $ = id => document.getElementById(id);
      const today = new Date();
      $('date').value = new Date(today.getTime() - today.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
      let students = [];

      function esc(v) {
        return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      function setMsg(text, error = false) {
        const m = $('msg');
        m.className = 'msg ' + (error ? 'err' : 'ok');
        m.textContent = text;
      }

      async function initScope() {
        try {
          const user = LSKERP.user();
          const org = await LSKERP.request('/api/organization').catch(() => ({}));
          const schoolName = org.school?.displayName || org.school?.name || 'School';
          const branches = org.branches || [];

          if (branches.length > 1) {
            $('branchBox').style.display = 'flex';
            $('branchSelect').innerHTML = branches.map(b => `<option value="${b.id}" ${b.id === user.branchId ? 'selected' : ''}>${esc(b.name)}</option>`).join('');
            $('branchSelect').onchange = async () => {
              try {
                await LSKERP.setBranch($('branchSelect').value);
                setMsg('Branch switched. Reloading class data…');
                await loadSections();
                await loadStudents();
              } catch (err) {
                setMsg(err.message, true);
              }
            };
          }

          const currentBranch = branches.find(b => b.id === user.branchId) || branches[0];
          $('scopeText').textContent = `${schoolName} • ${currentBranch?.name || 'Main Branch'}`;
        } catch (_) {
          $('scopeText').textContent = 'Anvi Mitra ERP • School Branch';
        }
      }

      async function init() {
        await initScope();
        try {
          const a = await LSKERP.request('/api/academic-sessions').catch(() => ({ sessions: [] }));
          const list = a.sessions || a.academicSessions || [];
          $('session').innerHTML = '<option value="">Current session</option>' + list.map(s => `<option value="${s.id}" ${s.isCurrent ? 'selected' : ''}>${esc(s.name || s.sessionName || s.id)}</option>`).join('');
          await loadSections();
          await loadStudents();
        } catch (e) {
          setMsg(e.message || 'Could not load setup data', true);
        }
      }

      async function loadSections() {
        try {
          const q = $('session').value ? '?sessionId=' + encodeURIComponent($('session').value) : '';
          const d = await LSKERP.request('/api/attendance/sections' + q).catch(() => ({ sections: [] }));
          $('section').innerHTML = '<option value="">All sections</option>' + (d.sections || []).map(s => `<option value="${s.sectionId || s.id}">${esc(s.className)} • ${esc(s.sectionName || s.name)} (${s.studentCount || 0})</option>`).join('');
        } catch (e) {
          setMsg(e.message || 'Could not load sections', true);
        }
      }

      async function loadStudents() {
        try {
          if (!$('date').value) throw new Error('Please select attendance date');
          setMsg('Loading student roster…');
          const q = new URLSearchParams({ date: $('date').value });
          if ($('session').value) q.set('sessionId', $('session').value);
          if ($('section').value) q.set('sectionId', $('section').value);

          const d = await LSKERP.request('/api/attendance/roster?' + q.toString());
          students = (d.roster || []).map(s => ({
            ...s,
            status: s.status || 'present',
            note: s.note || '',
          }));
          render();
          setMsg(students.length ? `Loaded ${students.length} student(s) for ${$('date').value}.` : 'No active students found for this section/session.', !students.length);
        } catch (e) {
          students = [];
          render();
          setMsg(e.message || 'Could not load students', true);
        }
      }

      function render() {
        const body = $('body');
        if (!students.length) {
          body.innerHTML = '<tr><td colspan="5" class="empty">No students found for selected filters.</td></tr>';
          updateCounts();
          return;
        }

        body.innerHTML = students.map((s, i) => `
          <tr>
            <td><b>${esc(s.fullName || '—')}</b></td>
            <td><code>${esc(s.admissionNo || '—')}</code></td>
            <td>${esc(s.className || '')} ${s.sectionName ? '• ' + esc(s.sectionName) : ''}</td>
            <td>
              <select class="status-select" onchange="students[${i}].status=this.value;updateCounts()">
                <option value="present" ${s.status === 'present' ? 'selected' : ''}>🟢 Present</option>
                <option value="absent" ${s.status === 'absent' ? 'selected' : ''}>🔴 Absent</option>
                <option value="late" ${s.status === 'late' ? 'selected' : ''}>🟡 Late</option>
                <option value="half_day" ${s.status === 'half_day' ? 'selected' : ''}>🔵 Half Day</option>
                <option value="leave" ${s.status === 'leave' ? 'selected' : ''}>⚪ Leave</option>
              </select>
            </td>
            <td>
              <input value="${esc(s.note || '')}" onchange="students[${i}].note=this.value" placeholder="Optional remark (e.g. sick leave)">
            </td>
          </tr>
        `).join('');

        updateCounts();
      }

      function setAll(status) {
        students.forEach(s => s.status = status);
        render();
      }

      function updateCounts() {
        $('count').textContent = students.length;
        $('present').textContent = students.filter(s => s.status === 'present').length;
        $('absent').textContent = students.filter(s => s.status === 'absent').length;
        $('late').textContent = students.filter(s => s.status === 'late').length;
        $('marked').textContent = students.filter(s => s.status).length;
      }

      async function save() {
        try {
          if (!students.length) throw new Error('No students to save');
          const btn = $('saveBtn');
          btn.disabled = true;
          btn.textContent = 'Saving…';

          const records = students.map(s => ({
            studentId: s.id,
            status: s.status,
            note: s.note || null,
          }));

          const res = await LSKERP.request('/api/attendance/bulk', {
            method: 'POST',
            body: JSON.stringify({
              date: $('date').value,
              sessionId: $('session').value || null,
              records,
            }),
          });

          setMsg(`✓ Attendance saved successfully for ${records.length} students!`, false);
        } catch (e) {
          setMsg(e.message || 'Could not save attendance', true);
        } finally {
          const btn = $('saveBtn');
          btn.disabled = false;
          btn.textContent = 'Save & Finalize Attendance';
        }
      }

      $('session').onchange = async () => {
        await loadSections();
        await loadStudents();
      };
      $('section').onchange = loadStudents;
      $('date').onchange = loadStudents;

      window.loadStudents = loadStudents;
      window.setAll = setAll;
      window.save = save;

      await init();
    })();
  </script>
</body>
</html>
